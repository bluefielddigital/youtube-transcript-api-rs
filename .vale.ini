# Prose lint for the docs and the comments in the Rust code, run by
# scripts/vale.py through pre-commit. The Google developer documentation
# style (.vale/styles/Google, errata-ai/Google v0.7.1) and write-good: their
# errors and warnings fail the check; Google's suggestions only print.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Crate

[*.md]
BasedOnStyles = Vale, Google, write-good
# Bans every form of "to be", which technical docs can't avoid.
write-good.E-Prime = NO
write-good.Cliches = error
write-good.Illusions = error
write-good.Passive = error
write-good.So = error
write-good.ThereIs = error
write-good.TooWordy = error
write-good.Weasel = error
Google.Colons = error
Google.Ellipses = error
Google.FirstPerson = error
Google.HeadingPunctuation = error
Google.Headings = error
Google.OxfordComma = error
Google.Ranges = error
Google.Spelling = error
Google.We = error
Google.Will = error
Google.WordListCase = error
Google.WordList = error
Vale.Avoid = error
Vale.Repetition = error
Vale.Spelling = error
Vale.Terms = error
TokenIgnores = (https?://[^\s)>]+)
